name: a-vibe-coded-story-organizer

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a-vibe-coded-story-organizer_app
    restart: unless-stopped
    working_dir: /app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - LOG_CHANNEL=stack
      - IMPORT_RUN_IN_BACKGROUND=true
      # Keep above IMPORT_TIMEOUT_SECONDS (1800), or a second worker takes a running import job.
      - DB_QUEUE_RETRY_AFTER=1860
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./database:/app/database
      - ./storage:/app/storage
    networks:
      - a-vibe-coded-story-organizer

networks:
  a-vibe-coded-story-organizer:
    driver: bridge
